<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>See & Say</title>
<style>
  :root{
    --ink:#0d1210;
    --paper:#f3efe6;
    --line:#0d1210;
    --accent:#ff5a2d;
    --ok:#2a7a4f;
    --mono:'JetBrains Mono', 'Courier New', monospace;
    --sans:'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--sans);
    height:100%;
    overflow:hidden;
  }
  #app{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
  }
  video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  video.mirrored, canvas.mirrored{ transform:scaleX(-1); }
  .scanline{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      0deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:overlay;
  }
  header{
    position:absolute;
    top:0;left:0;right:0;
    padding:16px 18px 10px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    z-index:5;
    background:linear-gradient(180deg, rgba(0,0,0,0.55), transparent);
  }
  .brand{
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#555;
    transition:background .2s;
  }
  .dot.live{background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .status{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-align:right;
    opacity:0.75;
    max-width:140px;
  }
  #callout{
    position:absolute;
    left:50%;
    bottom:120px;
    transform:translateX(-50%);
    z-index:5;
    text-align:center;
    pointer-events:none;
    width:92%;
  }
  #callout .label{
    display:inline-block;
    font-family:var(--sans);
    font-weight:700;
    font-size:clamp(22px,7vw,34px);
    text-transform:uppercase;
    letter-spacing:0.02em;
    background:var(--paper);
    color:var(--ink);
    padding:10px 20px;
    border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--accent);
    opacity:0;
    transition:opacity .25s ease, transform .25s ease;
  }
  #callout .label.show{
    opacity:1;
  }
  #callout .conf{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    margin-top:8px;
    opacity:0;
    letter-spacing:0.1em;
    transition:opacity .25s ease;
  }
  #callout .conf.show{opacity:0.85;}

  footer{
    position:absolute;
    bottom:0;left:0;right:0;
    z-index:5;
    padding:18px 18px 26px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
  }
  .controls{
    display:flex;
    gap:10px;
    align-items:center;
  }
  button{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:14px 16px;
    background:var(--paper);
    color:var(--ink);
    border:2px solid var(--ink);
    border-radius:0;
    cursor:pointer;
    flex:1;
    box-shadow:3px 3px 0 rgba(0,0,0,0.5);
  }
  button:active{
    transform:translate(2px,2px);
    box-shadow:1px 1px 0 rgba(0,0,0,0.5);
  }
  button.primary{
    background:var(--accent);
    color:var(--paper);
    border-color:var(--paper);
  }
  button:disabled{
    opacity:0.4;
    cursor:default;
  }
  .toggle-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--paper);
    opacity:0.85;
  }
  select{
    font-family:var(--mono);
    font-size:11px;
    background:transparent;
    color:var(--paper);
    border:1px solid var(--paper);
    padding:4px 6px;
  }
  #boot{
    position:absolute;
    inset:0;
    z-index:20;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:30px;
    text-align:center;
  }
  #boot h1{
    font-family:var(--sans);
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  #boot p{
    font-family:var(--mono);
    font-size:12px;
    line-height:1.6;
    opacity:0.7;
    max-width:280px;
    margin:0;
  }
  #boot button{
    width:220px;
    padding:16px 20px;
    font-size:13px;
  }
  .hidden{display:none !important;}
  #err{
    font-family:var(--mono);
    font-size:11px;
    color:#ff8a6a;
    max-width:280px;
  }
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="scanline"></div>

  <header>
    <div class="brand"><span class="dot" id="liveDot"></span>SEE &amp; SAY</div>
    <div class="status" id="statusText">loading model…</div>
  </header>

  <div id="callout">
    <span class="label" id="labelText"></span>
    <span class="conf" id="confText"></span>
  </div>

  <footer>
    <div class="toggle-row">
      <span>CAMERA</span>
      <select id="cameraSelect"></select>
    </div>
    <div class="toggle-row">
      <span>VOICE</span>
      <select id="voiceSelect"></select>
    </div>
    <div class="toggle-row">
      <span>LANGUAGE</span>
      <select id="langSelect">
        <option value="en">English</option>
        <option value="mn">Монгол (needs internet)</option>
      </select>
    </div>
    <div class="controls">
      <button id="modeToggleBtn">Mode: Object Detection</button>
    </div>
    <div class="controls">
      <button id="startBtn" class="primary">Start</button>
      <button id="stopBtn" disabled>Stop</button>
    </div>
    <div class="controls">
      <button id="readBtn" class="primary hidden">Capture &amp; Read</button>
    </div>
    <div class="toggle-row hidden" id="mirrorRow">
      <span>FIX BACKWARDS TEXT</span>
      <input type="checkbox" id="mirrorFixCheckbox">
    </div>
    <div class="controls">
      <button id="calibrateBtn">Calibrate distance</button>
    </div>
    <div class="controls">
      <button id="askClaudeBtn" class="primary">Check for danger</button>
    </div>
  </footer>

  <div id="boot">
    <h1>See &amp; Say</h1>
    <p>Points your camera at things and speaks what it sees, out loud through your earphones. Works fully in the browser — nothing leaves your phone.</p>
    <button id="bootStart" class="primary">Allow camera &amp; begin</button>
    <p id="err"></p>
  </div>
</div>

<script>
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load ' + src));
    document.head.appendChild(s);
  });
}
async function ensureLibraries(){
  if(window.cocoSsd && window.tf) return;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.15.0/tf.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/coco-ssd/2.2.2/coco-ssd.min.js');
  }catch(e){
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js');
  }
  if(!window.cocoSsd || !window.tf){
    throw new Error('Detection library failed to load. Check your internet connection.');
  }
}
async function ensureOCR(){
  if(window.Tesseract) return;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js');
  }catch(e){
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js');
  }
  if(!window.Tesseract){
    throw new Error('Reading library failed to load. Check your internet connection.');
  }
}
async function ensureAzureSpeech(){
  if(window.SpeechSDK) return;
  await loadScript('https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js');
  if(!window.SpeechSDK){
    throw new Error('Azure Speech library failed to load. Check your internet connection.');
  }
}
</script>
<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const bootStart = document.getElementById('bootStart');
const boot = document.getElementById('boot');
const statusText = document.getElementById('statusText');
const liveDot = document.getElementById('liveDot');
const labelText = document.getElementById('labelText');
const confText = document.getElementById('confText');
const cameraSelect = document.getElementById('cameraSelect');
const voiceSelect = document.getElementById('voiceSelect');
const langSelect = document.getElementById('langSelect');
const errBox = document.getElementById('err');

let model = null;
let stream = null;
let running = false;
let lastSpoken = '';
let lastSpokenTime = 0;
let rafId = null;
let voices = [];
let isMirrored = false;

// ---------- Known real-world object heights (meters), for rough distance estimate ----------
const OBJECT_HEIGHTS = {
  person:1.7, bicycle:1.0, car:1.5, motorcycle:1.1, airplane:4.0, bus:3.2,
  train:3.5, truck:3.3, boat:1.5, bench:0.9, bird:0.2, cat:0.25, dog:0.5,
  horse:1.6, sheep:0.8, cow:1.4, elephant:3.0, bear:1.2, zebra:1.4, giraffe:5.0,
  backpack:0.45, umbrella:0.9, handbag:0.3, tie:0.4, suitcase:0.6, bottle:0.25,
  'wine glass':0.18, cup:0.1, fork:0.2, knife:0.22, spoon:0.18, bowl:0.1,
  banana:0.18, apple:0.08, sandwich:0.06, orange:0.08, broccoli:0.15, carrot:0.18,
  'hot dog':0.15, pizza:0.03, donut:0.08, cake:0.12, chair:0.9, couch:0.85,
  'potted plant':0.5, bed:0.55, 'dining table':0.75, toilet:0.75, tv:0.5,
  laptop:0.25, mouse:0.04, remote:0.15, keyboard:0.03, 'cell phone':0.15,
  microwave:0.3, oven:0.6, toaster:0.2, sink:0.2, refrigerator:1.7, book:0.25,
  clock:0.3, vase:0.3, scissors:0.18, 'teddy bear':0.3, 'hair drier':0.22, toothbrush:0.18
};
// approx vertical field of view (degrees) for typical phone rear camera — overridden by calibration
let CAMERA_VFOV_DEG = parseFloat(localStorage.getItem('seeSayVFOV')) || 55;

function estimateDistance(p, frameHeightPx){
  const realHeight = OBJECT_HEIGHTS[p.class] || 0.3;
  const pixelHeight = p.bbox[3];
  if(pixelHeight <= 0) return null;
  const focalPx = (frameHeightPx/2) / Math.tan((CAMERA_VFOV_DEG/2) * Math.PI/180);
  const distanceM = (realHeight * focalPx) / pixelHeight;
  return distanceM;
}
function calibrate(knownDistanceM, knownHeightM, pixelHeight, frameHeightPx){
  // solve for VFOV given a known real distance/height/pixel measurement
  const focalPx = (pixelHeight * knownDistanceM) / knownHeightM;
  const vfovRad = 2 * Math.atan((frameHeightPx/2) / focalPx);
  CAMERA_VFOV_DEG = vfovRad * 180 / Math.PI;
  localStorage.setItem('seeSayVFOV', CAMERA_VFOV_DEG);
}
function formatDistance(m){
  if(m < 1) return Math.round(m*100) + 'cm';
  return (Math.round(m*10)/10) + 'm';
}

// ---------- Mongolian dictionary ----------
const MN_WORDS = {
  person:'хүн', bicycle:'унадаг дугуй', car:'машин', motorcycle:'мотоцикл',
  airplane:'онгоц', bus:'автобус', train:'галт тэрэг', truck:'ачааны машин',
  boat:'завь', bench:'сандал', bird:'шувуу', cat:'муур', dog:'нохой',
  horse:'морь', sheep:'хонь', cow:'үхэр', elephant:'заан', bear:'баавгай',
  zebra:'зебр', giraffe:'жираф', backpack:'цүнх', umbrella:'шүхэр',
  handbag:'гар цүнх', tie:'зангиа', suitcase:'чемодан', bottle:'лонх',
  'wine glass':'дарсны аяга', cup:'аяга', fork:'сэрээ', knife:'хутга',
  spoon:'халбага', bowl:'тавган аяга', banana:'гадил', apple:'алим',
  sandwich:'сэндвич', orange:'жүрж', broccoli:'брокколи', carrot:'лууван',
  'hot dog':'хот дог', pizza:'пицца', donut:'донат', cake:'бялуу',
  chair:'сандал', couch:'буйдан', 'potted plant':'цэцэг', bed:'ор',
  'dining table':'хоолны ширээ', toilet:'жорлон', tv:'зурагт',
  laptop:'зөөврийн компьютер', mouse:'хулгана', remote:'удирдлага',
  keyboard:'гар', 'cell phone':'гар утас', microwave:'микро долгионы зуух',
  oven:'зуух', toaster:'тостер', sink:'угаалтуур', refrigerator:'хөргөгч',
  book:'ном', clock:'цаг', vase:'ваар', scissors:'хайч',
  'teddy bear':'тоглоомын баавгай', 'hair drier':'үсний хатаагуур', toothbrush:'шүдний сойз'
};

// ---------- Voices ----------
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  if(voices.length === 0) voices = speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  voices.forEach((v,i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = v.name.slice(0,22);
    voiceSelect.appendChild(opt);
  });
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakEnglish(text){
  if(speechSynthesis.speaking) speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const v = voices[voiceSelect.value];
  if(v) utter.voice = v;
  utter.rate = 1.05;
  utter.pitch = 1;
  speechSynthesis.speak(utter);
}

// ---------- Azure Speech (Mongolian voice) ----------
const AZURE_SPEECH_KEY = "2YOi3mQGa30skQ1ukJe2GAurLeXkqwGRnFJIo0i8ZssXijdQS243JQQJ99CGAC3pKaRXJ3w3AAAYACOGw5bp";
const AZURE_SPEECH_REGION = "eastasia";
let azureSynthesizer = null;
let azureIsSpeaking = false;

async function getAzureSynthesizer(){
  await ensureAzureSpeech();
  if(azureSynthesizer) return azureSynthesizer;
  const speechConfig = SpeechSDK.SpeechConfig.fromSubscription(AZURE_SPEECH_KEY, AZURE_SPEECH_REGION);
  speechConfig.speechSynthesisVoiceName = "mn-MN-YesuiNeural";
  speechConfig.speechSynthesisOutputFormat = SpeechSDK.SpeechSynthesisOutputFormat.Audio16Khz32KBitRateMonoMp3;
  const audioConfig = SpeechSDK.AudioConfig.fromDefaultSpeakerOutput();
  azureSynthesizer = new SpeechSDK.SpeechSynthesizer(speechConfig, audioConfig);
  return azureSynthesizer;
}

async function speakMongolian(className, distanceText){
  // skip if a Mongolian phrase is still playing — prevents overlapping/stacked audio
  // that made it sound like it was "talking too much"
  if(azureIsSpeaking) return;
  const word = MN_WORDS[className] || className;
  const text = distanceText ? `${word}, ${distanceText}` : word;
  try{
    azureIsSpeaking = true;
    statusText.textContent = 'loading Mongolian voice…';
    const synth = await getAzureSynthesizer();
    statusText.textContent = 'speaking…';
    synth.speakTextAsync(
      text,
      result => {
        azureIsSpeaking = false;
        if(result.reason === SpeechSDK.ResultReason.SynthesizingAudioCompleted){
          statusText.textContent = running ? 'live' : 'stopped';
        } else {
          statusText.textContent = 'Mongolian voice error: ' + result.errorDetails;
        }
      },
      error => {
        azureIsSpeaking = false;
        statusText.textContent = 'Mongolian voice failed: ' + error;
        console.error(error);
      }
    );
  }catch(e){
    azureIsSpeaking = false;
    statusText.textContent = 'Mongolian voice unavailable: ' + e.message;
    console.error(e);
  }
}

function speak(className, distanceText){
  const lang = langSelect.value;
  if(lang === 'mn'){
    speakMongolian(className, distanceText);
  } else {
    const text = distanceText ? `${className}, about ${distanceText} away` : className;
    speakEnglish(text);
  }
}

// ---------- Camera enumeration ----------
async function listCameras(){
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  cameraSelect.innerHTML = '';
  cams.forEach((c,i) => {
    const opt = document.createElement('option');
    opt.value = c.deviceId;
    opt.textContent = c.label || `Camera ${i+1}`;
    cameraSelect.appendChild(opt);
  });
  // prefer back camera by default
  const back = cams.find(c => /back|rear|environment/i.test(c.label));
  if(back) cameraSelect.value = back.deviceId;
}

async function startCamera(deviceId){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
  }
  const constraints = {
    video: deviceId
      ? { deviceId: { exact: deviceId } }
      : { facingMode: { ideal: 'environment' } },
    audio: false
  };
  stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = stream;
  await new Promise(res => { video.onloadedmetadata = res; });
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;

  // Only mirror the preview for a front/selfie camera. A rear camera must NOT be
  // mirrored, otherwise text and everything else appears backwards.
  const track = stream.getVideoTracks()[0];
  const settings = (track && track.getSettings) ? track.getSettings() : {};
  const label = (track && track.label) || '';
  isMirrored = settings.facingMode === 'user' || /front|user|face|self/i.test(label);
  video.classList.toggle('mirrored', isMirrored);
  overlay.classList.toggle('mirrored', isMirrored);
}

// ---------- Detection loop ----------
async function detectLoop(){
  if(!running) return;
  if(video.readyState >= 2){
    const predictions = await model.detect(video);
    ctx.clearRect(0,0,overlay.width, overlay.height);

    let best = null;
    predictions.forEach(p => {
      if(p.score < 0.55) return;
      if(!best || p.score > best.score) best = p;
    });
    predictions.forEach(p => {
      if(p.score < 0.55) return;
      const d = estimateDistance(p, overlay.height);
      drawBox(p, d ? formatDistance(d) : null);
    });

    if(best){
      const pct = Math.round(best.score*100);
      const distM = estimateDistance(best, overlay.height);
      const distText = distM ? formatDistance(distM) : '';
      labelText.textContent = distText ? `${best.class} · ${distText}` : best.class;
      confText.textContent = pct + '% confident';
      labelText.classList.add('show');
      confText.classList.add('show');

      const now = Date.now();
      if(best.class !== lastSpoken || now - lastSpokenTime > 4000){
        speak(best.class, distText);
        lastSpoken = best.class;
        lastSpokenTime = now;
      }
    } else {
      labelText.classList.remove('show');
      confText.classList.remove('show');
    }
  }
  rafId = requestAnimationFrame(detectLoop);
}

function drawBox(p, distText){
  const [x,y,w,h] = p.bbox;
  ctx.strokeStyle = '#ff5a2d';
  ctx.lineWidth = 3;
  ctx.strokeRect(x,y,w,h);
  ctx.font = '14px monospace';
  ctx.fillStyle = '#ff5a2d';
  const text = distText ? `${p.class} ${distText}` : `${p.class} ${Math.round(p.score*100)}%`;
  const ty = y > 16 ? y - 6 : y + 16;
  if(isMirrored){
    const tw = ctx.measureText(text).width;
    ctx.save();
    ctx.scale(-1,1);
    ctx.fillText(text, -(x+tw+6), ty);
    ctx.restore();
  } else {
    ctx.fillText(text, x+4, ty);
  }
}

// ---------- Lifecycle ----------
async function init(){
  try{
    statusText.textContent = 'requesting camera…';
    await navigator.mediaDevices.getUserMedia({video:true}).then(s=>{
      s.getTracks().forEach(t=>t.stop());
    });
    await listCameras();
    statusText.textContent = 'loading libraries…';
    await ensureLibraries();
    statusText.textContent = 'loading model…';
    model = await cocoSsd.load();
    statusText.textContent = 'ready';
    boot.classList.add('hidden');
    startBtn.disabled = false;
  }catch(e){
    errBox.textContent = 'Camera or model failed to load: ' + e.message;
    statusText.textContent = 'error';
  }
}

async function begin(){
  await startCamera(cameraSelect.value);
  running = true;
  liveDot.classList.add('live');
  statusText.textContent = 'live';
  startBtn.disabled = true;
  stopBtn.disabled = false;
  detectLoop();
}

function stopAll(){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(stream) stream.getTracks().forEach(t => t.stop());
  liveDot.classList.remove('live');
  statusText.textContent = 'stopped';
  startBtn.disabled = false;
  stopBtn.disabled = true;
  labelText.classList.remove('show');
  confText.classList.remove('show');
  ctx.clearRect(0,0,overlay.width, overlay.height);
  speechSynthesis.cancel();
  if(azureSynthesizer){ try{ azureSynthesizer.close(); }catch(e){} azureSynthesizer = null; }
}

bootStart.addEventListener('click', async () => {
  await init();
  if(model) begin();
});
startBtn.addEventListener('click', begin);
stopBtn.addEventListener('click', stopAll);
cameraSelect.addEventListener('change', async () => {
  if(running) await startCamera(cameraSelect.value);
});

// ---------- Mode switching: Object Detection <-> Read Text ----------
let currentMode = 'detect'; // or 'read'
const modeToggleBtn = document.getElementById('modeToggleBtn');
const readBtn = document.getElementById('readBtn');
const calibrateBtnEl = document.getElementById('calibrateBtn');
const mirrorRow = document.getElementById('mirrorRow');
const mirrorFixCheckbox = document.getElementById('mirrorFixCheckbox');

modeToggleBtn.addEventListener('click', () => {
  if(currentMode === 'detect'){
    currentMode = 'read';
    modeToggleBtn.textContent = 'Mode: Read Text';
    startBtn.classList.add('hidden');
    stopBtn.classList.add('hidden');
    calibrateBtnEl.classList.add('hidden');
    askClaudeBtn.classList.add('hidden');
    readBtn.classList.remove('hidden');
    mirrorRow.classList.remove('hidden');
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    labelText.classList.remove('show');
    confText.classList.remove('show');
    if(overlay) ctx.clearRect(0,0,overlay.width, overlay.height);
    statusText.textContent = stream ? 'ready to read' : 'start camera below';
  } else {
    currentMode = 'detect';
    modeToggleBtn.textContent = 'Mode: Object Detection';
    startBtn.classList.remove('hidden');
    stopBtn.classList.remove('hidden');
    calibrateBtnEl.classList.remove('hidden');
    askClaudeBtn.classList.remove('hidden');
    readBtn.classList.add('hidden');
    mirrorRow.classList.add('hidden');
    statusText.textContent = running ? 'live' : 'stopped';
  }
});

readBtn.addEventListener('click', async () => {
  if(!stream){
    // start camera if not already running (reading mode doesn't need the detection model)
    try{
      await startCamera(cameraSelect.value);
    }catch(e){
      alert('Could not start camera: ' + e.message);
      return;
    }
  }
  readBtn.disabled = true;
  readBtn.textContent = 'Reading…';
  statusText.textContent = 'loading reading library…';
  try{
    await ensureOCR();
    const snap = document.createElement('canvas');
    snap.width = video.videoWidth;
    snap.height = video.videoHeight;
    const sctx = snap.getContext('2d');
    if(mirrorFixCheckbox.checked){
      sctx.translate(snap.width, 0);
      sctx.scale(-1,1);
    }
    sctx.drawImage(video, 0, 0, snap.width, snap.height);

    const lang = langSelect.value; // 'en' or 'mn'
    // Mongolian Cyrillic = Russian alphabet + Ө/Ү, so pairing 'mon' with 'rus'
    // is far more accurate than 'mon' alone.
    const tessLang = lang === 'mn' ? 'mon+rus' : 'eng';
    statusText.textContent = lang === 'mn' ? 'reading Mongolian text…' : 'reading English text…';
    const result = await Tesseract.recognize(snap, tessLang);
    const text = (result.data.text || '').trim();

    if(!text){
      labelText.textContent = 'No text found';
      labelText.classList.add('show');
      confText.classList.remove('show');
      statusText.textContent = 'ready to read';
    } else {
      labelText.textContent = text.length > 80 ? text.slice(0,80)+'…' : text;
      labelText.classList.add('show');
      confText.textContent = lang === 'mn' ? 'Монгол текст' : 'English text';
      confText.classList.add('show');
      if(lang === 'mn'){
        speakMongolian(text, '');
        statusText.textContent = 'Mongolian text found — reads aloud if voice available';
      } else {
        speakEnglish(text);
        statusText.textContent = 'ready to read';
      }
    }
  }catch(e){
    statusText.textContent = 'reading failed: ' + e.message;
    console.error(e);
  }finally{
    readBtn.disabled = false;
    readBtn.textContent = 'Capture & Read';
  }
});

document.getElementById('calibrateBtn').addEventListener('click', async () => {
  if(!running || !model) { alert('Start the camera first, then calibrate.'); return; }
  const distStr = prompt('Stand exactly this many meters from a person (or object), then enter the distance in meters, e.g. 1.5');
  if(!distStr) return;
  const knownDistance = parseFloat(distStr);
  if(!knownDistance || knownDistance <= 0){ alert('Enter a valid number.'); return; }
  const predictions = await model.detect(video);
  const person = predictions.find(p => p.class === 'person' && p.score > 0.5) || predictions[0];
  if(!person){ alert('No object detected — make sure it is clearly in frame, then try again.'); return; }
  const knownHeight = OBJECT_HEIGHTS[person.class] || 0.3;
  calibrate(knownDistance, knownHeight, person.bbox[3], overlay.height);
  alert(`Calibrated using "${person.class}" at ${knownDistance}m. Distance readings should now be more accurate.`);
});

// ---------- Ask Claude: hazard detection ----------
const askClaudeBtn = document.getElementById('askClaudeBtn');
askClaudeBtn.addEventListener('click', async () => {
  if(!running){ alert('Start the camera first.'); return; }
  askClaudeBtn.disabled = true;
  askClaudeBtn.textContent = 'Checking…';
  statusText.textContent = 'asking Claude…';
  try{
    const snap = document.createElement('canvas');
    snap.width = video.videoWidth;
    snap.height = video.videoHeight;
    const sctx = snap.getContext('2d');
    sctx.drawImage(video, 0, 0, snap.width, snap.height);
    const dataUrl = snap.toDataURL('image/jpeg', 0.85);
    const base64Data = dataUrl.split(',')[1];

    const prompt = "You are helping a blind child understand what is in front of them and whether anything nearby is dangerous. Look at this image. In under 35 words total: name the 2-3 most important things you see in simple words, then clearly say if anything is DANGEROUS (stairs, drop-offs, hot surfaces, sharp objects, moving vehicles, water, exposed wires, aggressive animals, or similar) and what to do. If nothing is dangerous, say 'Nothing dangerous nearby.' Speak plainly, no markdown, ready to be read aloud.";

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        messages: [{
          role: "user",
          content: [
            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Data } },
            { type: "text", text: prompt }
          ]
        }]
      })
    });
    const data = await response.json();
    const text = (data.content || []).map(b => b.text || '').join(' ').trim();
    if(text){
      labelText.textContent = text.length > 60 ? text.slice(0,60)+'…' : text;
      labelText.classList.add('show');
      confText.textContent = 'Claude';
      confText.classList.add('show');
      speakEnglish(text);
    } else {
      statusText.textContent = 'no response from Claude';
    }
  }catch(e){
    statusText.textContent = 'Claude check failed';
    console.error(e);
  }finally{
    askClaudeBtn.disabled = false;
    askClaudeBtn.textContent = 'Check for danger';
    statusText.textContent = running ? 'live' : 'stopped';
  }
});

</script>
